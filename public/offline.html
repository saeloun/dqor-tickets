<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Deccan Queen on Rails</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Inter", -apple-system, system-ui, sans-serif; background: #f8f6f2; color: #1f1f1f; }
    @media (prefers-color-scheme: dark) { body { background: #141110; color: #f1ece6; } }
    .offline { text-align: center; padding: 2rem; max-width: 28rem; }
    .offline h1 { font-size: 1.5rem; margin: 0 0 0.5rem; color: #981b34; }
    @media (prefers-color-scheme: dark) { .offline h1 { color: #e0708a; } }
    .offline p { margin: 0 0 1.5rem; line-height: 1.5; opacity: 0.85; }
    .offline button { font: inherit; font-weight: 600; padding: 0.75rem 1.5rem; border: 0; border-radius: 999px; background: #981b34; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main class="offline">
    <h1>You're offline</h1>
    <p>We can't reach the network right now. Your tickets are saved on this device — reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
