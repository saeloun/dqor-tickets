name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      real_clamav:
        description: Run bounded Linux ClamAV validation with official signatures
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/dqor_tickets_test"
      CHROME_PATH: /usr/bin/chromium-browser
      CHROME_NO_SANDBOX: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Chromium and Devanagari fonts for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser fonts-noto-core libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore

  real_clamav:
    if: github.event_name == 'workflow_dispatch' && inputs.real_clamav
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dqor_clamav_test
      HIRING_CLAMAV_INTEGRATION: "true"
      HIRING_CLAMSCAN_PATH: /usr/bin/clamscan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure private temporary database path
        run: echo "HIRING_CLAMAV_DATABASE=$RUNNER_TEMP/hiring-clamav-db" >> "$GITHUB_ENV"
      - name: Install distro CLI without starting services
        timeout-minutes: 3
        run: |
          sudo systemctl mask clamav-freshclam.service clamav-daemon.service
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam libvips-dev
      - name: Fetch official signatures once, with bounded retries
        timeout-minutes: 4
        run: |
          mkdir -m 700 "$HIRING_CLAMAV_DATABASE"
          cat > "$RUNNER_TEMP/hiring-freshclam.conf" <<EOF
          DatabaseDirectory $HIRING_CLAMAV_DATABASE
          DatabaseMirror database.clamav.net
          DNSDatabaseInfo current.cvd.clamav.net
          ConnectTimeout 10
          ReceiveTimeout 30
          MaxAttempts 1
          EOF
          timeout 180s freshclam --config-file="$RUNNER_TEMP/hiring-freshclam.conf" --stdout
      - name: Record engine and official signature versions
        run: |
          {
            echo '### Linux ClamAV validation versions'
            clamscan --database="$HIRING_CLAMAV_DATABASE" --version
            dpkg-query -W clamav clamav-freshclam
            for database in "$HIRING_CLAMAV_DATABASE"/*.cvd "$HIRING_CLAMAV_DATABASE"/*.cld; do
              if [ -f "$database" ]; then
                sigtool --info "$database"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare synthetic database
        run: bin/rails db:test:prepare
      - name: Real engine — synthetic PDF and harmless EICAR only
        timeout-minutes: 2
        run: timeout 90s bundle exec rspec spec/services/hiring/clamav_integration_spec.rb --format documentation
      - name: Remove task signatures and temporary config
        if: always()
        run: rm -rf -- "$HIRING_CLAMAV_DATABASE" "$RUNNER_TEMP/hiring-freshclam.conf"
