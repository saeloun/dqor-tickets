name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build the app or remove the retired Murderbot Render service
        type: choice
        default: build
        options: [build, remove-murderbot]

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            RUBY_VERSION=4.0.6

      - name: Trigger Render to pull the new image
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"imageUrl":"ghcr.io/saeloun/dqor-tickets:latest"}' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          else
            echo "Render secrets not set; skipping deploy trigger."
          fi

  remove-murderbot:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'remove-murderbot' && github.repository == 'saeloun/dqor-tickets'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Remove only the retired Murderbot service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          service_id = "srv-d9lefv95efls73b6qk90"
          url = f"https://api.render.com/v1/services/{service_id}"
          key = os.environ.get("RENDER_API_KEY")
          if not key:
              raise SystemExit("Render credential is unavailable")

          def request(method):
              req = Request(url, method=method, headers={"Authorization": f"Bearer {key}"})
              try:
                  with urlopen(req, timeout=30) as response:
                      return response.status, json.load(response) if method == "GET" else None
              except HTTPError as error:
                  return error.code, None
              except (URLError, ValueError):
                  raise SystemExit("Render request failed; response details suppressed") from None

          status, service = request("GET")
          if status == 404:
              print("Murderbot Render service is already absent")
              raise SystemExit(0)
          if status != 200:
              raise SystemExit(f"Render preflight failed: HTTP {status}")
          if (service.get("id"), service.get("name"), service.get("ownerId")) != (
              service_id, "murderbot-club", "tea-cspvgg0gph6c738l6k20"
          ):
              raise SystemExit("Refusing to delete an unexpected service")
          if service.get("serviceDetails", {}).get("disk"):
              raise SystemExit("Refusing to delete a service with a persistent disk")

          status, _ = request("DELETE")
          if status != 204:
              raise SystemExit(f"Render deletion failed: HTTP {status}")
          status, _ = request("GET")
          if status != 404:
              raise SystemExit(f"Service absence is unverified: HTTP {status}")
          print("Deleted Murderbot Render service; verified HTTP 404")
          PY
