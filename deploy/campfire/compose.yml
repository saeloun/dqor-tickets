name: dqor-campfire

services:
  chat:
    image: dqor-campfire:be39e42-569ff565
    container_name: dqor-campfire
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cpus: 2
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    env_file:
      - /opt/dqor-campfire/access.env
    environment:
      SPINEL_WORKERS: "2"
      RAILS_ENV: "production"
      BLOG_DB: "storage/development.sqlite3"
      GOOGLE_LOGIN_ENABLED: "true"
      RUNTIME_DASHBOARD_ENABLED: "true"
      RH_REQUEST_METRICS: "1"
    ports:
      - "127.0.0.1:4300:3000"
    volumes:
      - /opt/dqor-campfire/storage:/app/storage
    networks:
      - kamal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kamal:
    external: true
