name: dqor-campfire

services:
  chat:
    image: dqor-campfire:a91496ff7aad
    container_name: dqor-campfire
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cpus: 2
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    environment:
      SPINEL_WORKERS: "2"
    ports:
      - "127.0.0.1:4300:3000"
    volumes:
      - /opt/dqor-campfire/storage:/app/storage
    networks:
      - kamal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kamal:
    external: true
